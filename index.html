<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WatchInd — Watch. Discover. Share.</title>
<meta name="description" content="WatchInd — India's independent video platform. Watch shorts and long videos, create your channel, upload and share.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a855f7'/%3E%3Cstop offset='.5' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230a0a12'/%3E%3Cpath d='M14 20 L24 44 L32 28 L40 44 L50 20' stroke='url(%23g)' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============ WatchInd v2 — brand system ============ */
:root{
  --bg:#050509; --bg2:#0a0a12; --card:#12121b; --card2:#17171f;
  --line:rgba(255,255,255,.08);
  --txt:#f4f4f8; --mut:#a7a7b8; --dim:#6e6e80;
  --purple:#a855f7; --purple2:#7c3aed; --cyan:#22d3ee; --pink:#ec4899;
  --grad:linear-gradient(135deg,#a855f7 0%,#6366f1 45%,#22d3ee 100%);
  --grad2:linear-gradient(135deg,#ec4899 0%,#a855f7 60%,#22d3ee 100%);
  --glow:0 0 24px rgba(168,85,247,.35);
  --r:14px; --r-sm:10px;
  --glass:rgba(14,14,22,.72);
  --shadow:0 10px 34px rgba(0,0,0,.5);
  --hdr:64px; --bnav:60px;
}
[data-theme="light"]{
  --bg:#f6f6fb; --bg2:#ffffff; --card:#ffffff; --card2:#f1f1f7;
  --line:rgba(20,20,40,.1);
  --txt:#14141c; --mut:#55556a; --dim:#8a8a9c;
  --glass:rgba(255,255,255,.78);
  --shadow:0 10px 30px rgba(80,60,160,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;width:100%;outline:none;transition:border .2s, box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.18)}
textarea{min-height:110px;resize:vertical}
::placeholder{color:var(--dim)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c2c3a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* splash */
.splash{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
.splash.hide{opacity:0;pointer-events:none}
.splash-logo{display:flex;align-items:center;gap:14px}
.splash-word{font-size:38px;font-weight:800;letter-spacing:.5px}
.splash-word em,.logo-text em{font-style:normal;background:var(--grad2);-webkit-background-clip:text;background-clip:text;color:transparent}
.wmark{width:40px;height:40px;flex:none}
.wmark-anim{animation:wpulse 1.6s ease-in-out infinite}
@keyframes wpulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(168,85,247,.5))}50%{transform:scale(1.08);filter:drop-shadow(0 0 16px rgba(34,211,238,.7))}}

/* topbar */
.topbar{position:sticky;top:0;z-index:90;height:var(--hdr);display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:800;letter-spacing:.3px}
.logo .wmark{width:32px;height:32px}
.logo-text em{font-style:normal}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;transition:background .2s}
.icon-btn:hover{background:rgba(255,255,255,.07)}
.searchbar{flex:1;max-width:560px;margin:0 auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;overflow:hidden;transition:border .2s, box-shadow .2s}
.searchbar:focus-within{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.searchbar input{border:0;background:transparent;padding:10px 18px;border-radius:0}
.searchbar input:focus{box-shadow:none}
.searchbar button{padding:0 18px;color:var(--mut)}
.searchbar button:hover{color:var(--txt)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.bell{position:relative}
.bell .dot{position:absolute;top:6px;right:8px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--grad2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--grad);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.avatar.lg{width:84px;height:84px;font-size:30px}
.avatar.xl{width:120px;height:120px;font-size:44px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;transition:transform .15s, box-shadow .2s, background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:var(--glow)}
.btn.primary:hover{box-shadow:0 0 32px rgba(168,85,247,.55)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#ec4899);border:0;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer;transition:all .2s;white-space:nowrap}
.chip:hover{color:var(--txt);border-color:var(--purple)}
.chip.on{background:var(--grad);color:#fff;border:0;box-shadow:var(--glow)}

/* shell layout */
.shell{display:flex;min-height:calc(100vh - var(--hdr))}
.sidebar{width:236px;flex:none;padding:18px 12px;border-right:1px solid var(--line);position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow-y:auto;display:flex;flex-direction:column}
.sidebar nav{display:flex;flex-direction:column;gap:2px}
.snav{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;color:var(--mut);font-weight:600;font-size:14.5px;transition:all .18s}
.snav svg{flex:none}
.snav:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.snav.on{background:linear-gradient(135deg,rgba(168,85,247,.22),rgba(34,211,238,.12));color:var(--txt);box-shadow:inset 0 0 0 1px rgba(168,85,247,.3)}
.side-foot{margin-top:auto;padding:14px 8px 4px;color:var(--dim);font-size:12px}
.side-tag{background:var(--grad2);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;margin-bottom:4px}
.app{flex:1;min-width:0;padding:22px 26px 90px;max-width:1560px;margin:0 auto;width:100%}
.bottomnav{display:none}

/* cards & grids */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.vcard{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .2s, box-shadow .25s, border-color .2s;cursor:pointer}
.vcard:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:rgba(168,85,247,.4)}
.thumb{position:relative;aspect-ratio:16/9;background:#0b0b12;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.vcard:hover .thumb img{transform:scale(1.05)}
.dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.78);padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600}
.badge-vis{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);border:1px solid var(--line);padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.vmeta{display:flex;gap:12px;padding:13px 14px}
.vmeta .avatar{width:38px;height:38px;font-size:15px}
.vtitle{font-weight:700;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vsub{color:var(--mut);font-size:13px;margin-top:5px}
.shelf{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.shelf::-webkit-scrollbar{height:6px}
.scard{flex:0 0 168px;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .2s, box-shadow .2s}
.scard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.scard .thumb{aspect-ratio:9/16}
.scard .vtitle{font-size:13px;padding:10px}
.sect{margin:30px 0 8px}
.sect h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.sect h2 .bar{width:5px;height:22px;border-radius:3px;background:var(--grad2)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:14px 2px;position:sticky;top:var(--hdr);background:var(--bg);z-index:20}
.chips::-webkit-scrollbar{height:0}

/* skeleton */
.skel{border-radius:var(--r);background:linear-gradient(100deg,var(--card) 40%,var(--card2) 50%,var(--card) 60%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.skel-card{height:250px}
.skel-line{height:16px;border-radius:8px;margin:8px 0}

/* forms */
.form{max-width:520px;margin:34px auto;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
.form h1{font-size:24px;margin-bottom:6px}
.form p.sub{color:var(--mut);margin-bottom:20px;font-size:14px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:7px}
.row{display:flex;gap:10px;align-items:center}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#f87171;padding:11px 14px;border-radius:var(--r-sm);margin-bottom:15px;font-size:14px}
.okmsg{background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.4);color:var(--cyan);padding:11px 14px;border-radius:var(--r-sm);margin-bottom:15px;font-size:14px}
.link{color:var(--cyan);font-weight:600}
.link:hover{text-decoration:underline}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.check input{width:auto;accent-color:var(--purple)}

/* toasts & modal */
.toasts{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{background:#1b1b26;color:#fff;border:1px solid rgba(168,85,247,.45);padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:tin .25s ease}
[data-theme="light"] .toast{background:#14141c}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.modal-veil{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:250;display:flex;align-items:center;justify-content:center;padding:18px;animation:tin .2s}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;max-width:440px;width:100%;box-shadow:var(--shadow)}
.modal h3{font-size:19px;margin-bottom:10px}
.modal p{color:var(--mut);font-size:14px;margin-bottom:20px;line-height:1.55}
.modal .row{justify-content:flex-end}

/* player */
.player{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;box-shadow:var(--shadow);user-select:none}
.player video{width:100%;height:100%;object-fit:contain;background:#000}
.pctl{position:absolute;inset:auto 0 0 0;padding:26px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.82));opacity:0;transition:opacity .25s}
.player:hover .pctl,.player.paused .pctl,.player.touched .pctl{opacity:1}
.pbar{height:5px;background:rgba(255,255,255,.22);border-radius:3px;cursor:pointer;position:relative;margin-bottom:8px}
.pbar:hover{height:7px}
.pfill{position:absolute;inset:0 auto 0 0;background:var(--grad2);border-radius:3px;width:0%}
.pbuf{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.25);border-radius:3px;width:0%}
.prow{display:flex;align-items:center;gap:6px}
.ptime{color:#ddd;font-size:12.5px;margin:0 8px;white-space:nowrap}
.pmenu{position:absolute;bottom:56px;right:12px;background:rgba(12,12,20,.96);border:1px solid var(--line);border-radius:12px;min-width:190px;overflow:hidden;z-index:5}
.pmenu button{display:flex;width:100%;padding:11px 16px;font-size:14px;align-items:center;justify-content:space-between}
.pmenu button:hover{background:rgba(168,85,247,.18)}
.pmenu button.on{color:var(--cyan);font-weight:700}
.bigplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.bigplay span{width:78px;height:78px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:var(--glow);animation:wpulse 2s infinite}
.spin{width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--cyan);animation:rot .8s linear infinite;position:absolute;top:50%;left:50%;margin:-26px}
@keyframes rot{to{transform:rotate(360deg)}}

/* watch page, channel, comments, studio, admin, misc */
.wlayout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;align-items:start}
.wtitle{font-size:21px;font-weight:800;line-height:1.4;margin:16px 0 8px}
.wrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.chanline{display:flex;align-items:center;gap:12px;margin-right:auto}
.chanline .nm{font-weight:700}
.chanline .hs{color:var(--mut);font-size:13px}
.wactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;transition:all .18s}
.pill:hover{border-color:var(--purple);transform:translateY(-1px)}
.pill.on{background:var(--grad);border:0;color:#fff;box-shadow:var(--glow)}
.pill .cnt{opacity:.85;font-weight:600}
.desc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.desc.clamp{max-height:96px;overflow:hidden;position:relative;cursor:pointer}
.desc.clamp::after{content:"…more";position:absolute;bottom:6px;right:12px;color:var(--cyan);font-weight:700;background:linear-gradient(transparent,var(--card) 55%);padding-left:30px}
.rail .vcard{display:flex;gap:10px;margin-bottom:12px}
.rail .thumb{width:170px;flex:none;aspect-ratio:16/9}
.rail .vmeta{padding:4px 2px}
.rail .vtitle{font-size:13.5px}
.rail h3{font-size:16px;margin-bottom:14px}

/* comments */
.cbox{display:flex;gap:12px;margin:18px 0}
.cbox .avatar{width:38px;height:38px;font-size:15px}
.citem{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.citem .avatar{width:36px;height:36px;font-size:14px;flex:none}
.cbody{flex:1;min-width:0}
.chead{font-size:13px;margin-bottom:4px}
.chead b{margin-right:8px}
.chead span{color:var(--dim)}
.ctext{font-size:14.5px;line-height:1.6;word-break:break-word}
.cacts{display:flex;gap:4px;align-items:center;margin-top:8px}
.cacts .icon-btn{width:32px;height:32px;font-size:12.5px;color:var(--mut)}
.cacts .icon-btn.on{color:var(--cyan)}
.creply{margin:10px 0 0 48px;border-left:2px solid rgba(168,85,247,.35);padding-left:14px}

/* channel */
.banner{height:200px;border-radius:18px;background:linear-gradient(120deg,#2a1245,#0e2a3a 55%,#3a0f2a);background-size:cover;background-position:center;border:1px solid var(--line);overflow:hidden}
.chead2{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:-46px 0 18px;padding:0 8px}
.chead-id{display:flex;gap:16px;align-items:center;min-width:0;flex:1 1 240px}
.chead-txt{min-width:0}
.chead-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chead2 .avatar{border:4px solid var(--bg);flex-shrink:0}
.chnm{font-size:24px;font-weight:800;overflow-wrap:anywhere}
.chsub{color:var(--mut);font-size:13.5px;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0;overflow-x:auto}
.tab{padding:12px 18px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--txt);border-color:var(--purple)}

/* studio */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.stat{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stat .n{font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{color:var(--mut);font-size:13px;margin-top:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:left;padding:13px 14px;color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.025)}
.tt{width:120px;height:68px;object-fit:cover;border-radius:8px;background:#0b0b12}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel h3{margin-bottom:14px;font-size:17px}

/* upload */
.upl{max-width:760px;margin:26px auto}
.drop{border:2px dashed rgba(168,85,247,.5);border-radius:18px;padding:44px 20px;text-align:center;background:rgba(168,85,247,.05);cursor:pointer;transition:all .2s}
.drop:hover{background:rgba(168,85,247,.1);border-color:var(--purple)}
.drop.over{background:rgba(34,211,238,.08);border-color:var(--cyan)}
.prog{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;width:0;background:var(--grad2);border-radius:6px;transition:width .2s}
.steps{display:flex;gap:8px;margin:16px 0}
.step{flex:1;text-align:center;font-size:12.5px;color:var(--dim);padding:9px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.step.on{color:#fff;background:var(--grad);border:0;font-weight:700}
.step.done{color:var(--cyan);border-color:var(--cyan)}

/* notifications */
.nitem{display:flex;gap:14px;padding:15px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);cursor:pointer;transition:border .2s}
.nitem:hover{border-color:var(--purple)}
.nitem.unread{border-color:rgba(168,85,247,.55);background:linear-gradient(160deg,rgba(168,85,247,.1),var(--card))}
.nitem .t{font-weight:700;font-size:14.5px}
.nitem .b{color:var(--mut);font-size:13.5px;margin-top:4px}
.nitem .d{color:var(--dim);font-size:12px;margin-top:6px}

/* dropdown menu */
.dd{position:relative}
.ddmenu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:220px;box-shadow:var(--shadow);z-index:120;overflow:hidden;padding:6px}
.ddmenu button,.ddmenu a{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;font-size:14px;border-radius:9px;text-align:left}
.ddmenu button:hover,.ddmenu a:hover{background:rgba(168,85,247,.14)}
.ddmenu .sep{height:1px;background:var(--line);margin:6px 4px}

/* misc */
.pagehead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:24px;font-weight:800}
.pagehead .sp{margin-left:auto;display:flex;gap:8px}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty .big{font-size:46px;margin-bottom:12px}
.empty h3{color:var(--txt);margin-bottom:8px;font-size:18px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv b{font-weight:700}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.35);color:var(--cyan);padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
.themebtn{font-size:18px}
.hide-sm{display:inline}
.only-mobile{display:none}

/* responsive */
@media(max-width:1100px){
  .wlayout{grid-template-columns:1fr}
  .rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .rail .vcard{display:block}
  .rail .thumb{width:100%}
}
@media(max-width:860px){
  .sidebar{display:none}
  .sidebar.open{display:flex;position:fixed;left:0;top:var(--hdr);bottom:0;z-index:100;background:var(--bg);width:250px;box-shadow:var(--shadow)}
  .app{padding:16px 14px 96px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--glass);backdrop-filter:blur(14px);border-top:1px solid var(--line);height:calc(var(--bnav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:10.5px;font-weight:600}
  .bottomnav a.on{color:var(--txt)}
  .bottomnav a.on svg{filter:drop-shadow(0 0 6px rgba(168,85,247,.8))}
  .bottomnav .fab{position:relative}
  .bottomnav .fab span{width:46px;height:46px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;box-shadow:var(--glow);margin-top:-18px}
  .searchbar{max-width:none}
  .hide-sm{display:none}
  .grid2{grid-template-columns:1fr}
  .banner{height:130px}
  .chead2{margin-top:-34px}
  .vgrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .vmeta{padding:9px 10px;gap:9px}
  .vmeta .avatar{width:32px;height:32px;font-size:12px}
  .vtitle{font-size:13px}
  .wtitle{font-size:18px}
}

/* shorts studio + create chooser */
.bottomnav button.fab{flex:1;background:none;border:0;padding:0;margin:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);font:inherit}
.create-opt{display:flex;align-items:center;gap:14px;width:100%;padding:18px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;cursor:pointer;text-align:left;margin-bottom:12px}
.create-opt:hover{border-color:var(--purple)}
.create-opt .em{font-size:30px}
.create-opt b{display:block;font-size:16px}
.create-opt small{color:var(--mut);font-size:12.5px}
.camwrap{position:relative;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}
.camwrap video{width:100%;max-height:62vh;display:block;background:#000}
.camtimer{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;font-size:14px}
.camwrap #cFlip{position:absolute;bottom:12px;right:12px}
.recbtn{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#ef4444;cursor:pointer}
.recbtn.on{animation:recpulse 1.2s infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 14px rgba(239,68,68,0)}}
.track{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--txt);font:inherit;cursor:pointer;margin-bottom:8px;text-align:left}
.track.on{border-color:var(--purple);background:rgba(168,85,247,.12)}
.track .tem{font-size:20px}
.track .tname{flex:1;font-weight:600;font-size:14.5px}
.track .tplay{font-size:18px;opacity:.85;padding:4px 8px}

</style>
